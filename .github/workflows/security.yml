name: Security

on:
  push:
    branches:
      - 'dev/**'
  pull_request:
  schedule:
    - cron: '0 5 * * 1'   # Mondays 05:00 UTC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  security-events: write   # required to upload SARIF results

jobs:
  # ─── Dependency Review ───────────────────────────────────────────────────────
  # Fails a PR if any added or changed dependency has a known CVE.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Dependency review
        uses: actions/dependency-review-action@v4

  # ─── Semgrep ─────────────────────────────────────────────────────────────────
  # SAST for PHP: OWASP Top 10, injection, path traversal, insecure functions.
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan
        run: semgrep scan --sarif --output semgrep.sarif --config "p/php" --config "p/owasp-top-ten"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
