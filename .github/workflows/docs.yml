name: Docs

on:
  # Deploys. Docs published to Pages always match the released version.
  push:
    branches:
      - 'release/**'
  # Build only — catches dead links and broken config before merge.
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

# Pages allows a single concurrent deployment. Do not cancel a running one:
# an interrupted deploy can leave the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ─── Build ───────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # VitePress `lastUpdated` reads each page's git history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Build site
        run: npm run docs:build
        working-directory: docs

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  # ─── Deploy ──────────────────────────────────────────────────────────────────
  # Requires Settings → Pages → Source = "GitHub Actions" and the github-pages
  # environment to allow `release/*` as a deployment branch.
  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
